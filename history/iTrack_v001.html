<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>№ 27 — iTrack · v001</title>
<style>
  :root{
    --bg:#05070a; --ink:#e6ecf2; --dim:#7a8794; --accent:#8fc8e8; --warm:#e8c86f; --ok:#7fd6a2; --bad:#e8896f; --line:rgba(230,236,242,0.10);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:var(--bg);color:var(--ink);
    font-family:'JetBrains Mono',ui-monospace,monospace;overflow:hidden}
  #ui{position:fixed;inset:0;display:grid;gap:12px;padding:12px;
    grid-template-columns:320px minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}
  .panel{background:rgba(5,7,10,0.74);border:1px solid var(--line);padding:10px 12px;overflow-y:auto;min-height:0}
  .panel::-webkit-scrollbar{width:4px}
  .panel::-webkit-scrollbar-thumb{background:var(--line)}
  #top{grid-column:1/-1;display:flex;align-items:center;gap:18px;flex-wrap:wrap;padding:11px 15px}
  .brand h1{font-family:Georgia,'Cormorant Garamond',serif;font-style:italic;font-weight:400;font-size:19px;color:var(--accent);line-height:1.15}
  .brand .sub{font-size:8px;letter-spacing:.3em;text-transform:uppercase;color:var(--dim)}
  #main{display:flex;flex-direction:column;gap:8px;overflow:hidden;min-height:0}
  #view{position:relative;flex:1 1 auto;min-height:0;border:1px solid var(--line);background:#080b0f;overflow:hidden}
  #view canvas,#view img,#view video{position:absolute}
  #ov{pointer-events:none}
  #diag{flex:0 0 auto;font-size:9px;line-height:1.7;color:var(--dim);min-height:16px;max-height:60px;overflow-y:auto}
  #diag b{color:var(--accent);font-weight:400}
  .ok{color:var(--ok)} .bad{color:var(--bad)} .warm{color:var(--warm)}
  #hud{margin-left:auto;font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);text-align:right;line-height:1.9}
  #hud b{color:var(--ink);font-weight:400}
  .grp{font-size:8.5px;letter-spacing:.3em;text-transform:uppercase;color:var(--dim);
    border-top:1px solid var(--line);margin:10px 0 2px;padding-top:7px;opacity:.75}
  .grp:first-child{border-top:0;padding-top:0;margin-top:0}
  .row{margin:4px 0}
  .row.sl{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) 46px;align-items:center;gap:6px}
  .row label{font-size:8.5px;letter-spacing:.1em;line-height:1.25;text-transform:uppercase;color:var(--dim);display:block}
  .row.kv{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1.5fr);align-items:center;gap:6px}
  .row .v{font-size:9.5px;text-align:right;color:var(--ink)}
  input[type=range]{-webkit-appearance:none;width:100%;height:2px;background:var(--line);outline:none}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:11px;height:11px;border-radius:50%;background:var(--accent);cursor:pointer}
  select{width:100%;background:rgba(5,7,10,0.9);border:1px solid var(--line);color:var(--ink);
    font-family:inherit;font-size:10px;letter-spacing:.06em;padding:3px 6px;outline:none}
  select:hover{border-color:var(--accent)}
  .chk{display:flex;align-items:center;gap:8px;margin:5px 0}
  .chk input{accent-color:var(--accent)}
  .chk label{font-size:8.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);cursor:pointer}
  .btns{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
  button{flex:1;background:transparent;border:1px solid var(--line);color:var(--ink);
    font-family:inherit;font-size:9px;letter-spacing:.2em;text-transform:uppercase;padding:7px 9px;cursor:pointer;white-space:nowrap}
  button:hover,button.on{border-color:var(--accent);color:var(--accent)}

  #top .btns{margin:0}
  .list{border:1px solid var(--line);margin:6px 0}

  .item:last-child{border-bottom:0}
  .item.sel{color:var(--ink);background:rgba(143,200,232,0.08);box-shadow:inset 3px 0 0 var(--accent)}
  .item .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .item .ty{font-size:8px;letter-spacing:.2em;opacity:.6;text-transform:uppercase}

  .note{margin:5px 0;font-size:8.5px;line-height:1.7;letter-spacing:.04em;color:var(--dim)}

  .drop:hover,.drop.over{border-color:var(--accent);color:var(--accent)}
  input[type=file]{display:none}
  /* the stage: calibration, validation, playback (fullscreen) */
  #stage{position:fixed;inset:0;background:#000;display:none;cursor:none;z-index:10}
  #stage.on{display:block}
  #stage.cur{cursor:default}
  #stage img,#stage video{position:absolute;object-fit:fill}
  #stage canvas{position:absolute;inset:0;width:100%;height:100%}
  #msg{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);max-width:640px;text-align:center;font-size:11px;line-height:1.9;letter-spacing:.05em;color:var(--dim);pointer-events:none}
  #msg b{color:var(--ink);font-weight:400}
  #msg h2{font-family:Georgia,'Cormorant Garamond',serif;font-style:italic;font-weight:400;font-size:24px;color:var(--accent);margin-bottom:8px}
</style>

<body>
<div id="ui">
  <div id="top" class="panel">
    <div class="brand"><h1>iTrack</h1><div class="sub">№ 27 · v001 — webcam eye tracking</div></div>
    <div class="btns">
      <button id="bcam" type="button">1 · Camera</button>
      <button id="bcal" type="button" disabled>2 · Calibrate</button>
      <button id="btest" type="button" disabled title="Fullscreen gaze dot, to check the calibration">Test gaze</button>
      <button id="brun" type="button" disabled>3 · Run</button>
      <button id="brev" type="button" disabled>4 · Review</button>
    </div>
    <div id="hud"></div>
  </div>
  <div id="left" class="panel"></div>
  <div id="main">
    <div id="view"><canvas id="cv"></canvas><canvas id="ov"></canvas></div>
    <div id="diag"></div>
  </div>
</div>
<div id="stage"><canvas id="sc"></canvas><div id="msg"></div></div>
<video id="cam" playsinline muted style="display:none"></video>
<input id="fin" type="file" multiple accept="image/*,video/*">
<input id="jin" type="file" accept=".json,application/json">
<script type="module">
/* ═══════════════════════════════════════════════════════════════════════
   № 27 — iTrack · v001

   Webcam eye tracking in the browser. Load images and videos, calibrate
   by looking at the screen corners and clicking them, then the files play
   in sequence (fullscreen) while the gaze is recorded; review as heatmap
   and scanpath, export CSV / JSON / PNG. Nothing leaves the browser.

   Face and iris landmarks: MediaPipe Face Landmarker (Apache-2.0, 478
   points including both irises, plus the head pose matrix and blink
   blendshapes). WebGazer.js was the other candidate; it is GPL-3.0 and no
   longer maintained, so the gaze model here is our own:

   - eye feature per eye: the iris centre relative to the eye's corner axis,
     normalised by the eye width (ex along the axis, ey across it); both eyes
     averaged. Width-normalised, so it does not change with distance.
   - optional head compensation: ex += k 0.4 yaw, ey += k 0.4 pitch (the
     eyeball radius is about 0.4 eye widths, so 0.4 rad of eye rotation per
     eye width; k is a slider, signed, default 0)
   - mapping: least squares (light ridge) from the feature to the normalised
     screen position; 4 targets fit a bilinear map (1, ex, ey, ex ey), 9
     targets add ex^2 and ey^2. Every frame of every click is a sample,
     outliers beyond 3 MAD of their target are dropped.
   - calibration sample window: 400 ms before to 400 ms after each click,
     blinks removed (blink blendshape > 0.45)
   - validation: 5 points shown automatically; accuracy (px, and degrees from
     the head distance in the pose matrix at 96 CSS px per inch)
   - drift check before each file (optional): look at the cross, press
     Space; the offset is corrected additively
   - smoothing: One Euro filter on the normalised gaze (raw kept too)
   - review: I-DT fixations (dispersion, minimum duration), heatmap of
     gaussian splats weighted by sample duration, scanpath; videos with a
     time window around the playhead
   ═══════════════════════════════════════════════════════════════════════ */
'use strict';
const $ = (id) => document.getElementById(id);
const MP = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14';
const MODEL = 'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task';

/* ── state ── */
const OPT_DEF = { imgDur: 5, mute: true, drift: true, calib: '4', rounds: 2, inset: 40, smooth: 0.6, head: 0, gap: 0.5, showGaze: false,
  radius: 45, disp: 70, minFix: 100, win: 1.5, heat: true, path: true, raw: false, alpha: 0.65 };
const S = { files: [], opt: { ...OPT_DEF }, model: null, rec: [], sel: 0, view: 'setup' };
try { Object.assign(S.opt, JSON.parse(localStorage.getItem('itrack.v001.opt') || '{}')); } catch (e) { /* storage off */ }
const saveOpt = () => { try { localStorage.setItem('itrack.v001.opt', JSON.stringify(S.opt)); } catch (e) { /* storage off */ } };

/* ── log / hud ── */
function log(t) { const d = $('diag'); d.innerHTML = t + '<br>' + d.innerHTML.split('<br>').slice(0, 4).join('<br>'); }
let FPS = 0, FACE = false, BLINK = false;
function hud() {
  const m = S.model;
  $('hud').innerHTML = `camera <b>${CAM.on ? 'on' : 'off'}</b> · face <b class="${FACE ? 'ok' : 'bad'}">${FACE ? (BLINK ? 'blink' : 'yes') : 'no'}</b> · <b>${FPS.toFixed(0)}</b> fps<br>`
    + `calibration <b>${m ? `${m.kind} pts · ${m.err ? m.err.px.toFixed(0) + ' px' : 'not validated'}` : 'none'}</b> · files <b>${S.files.length}</b> · recorded <b>${S.rec.length}</b>`;
  $('bcal').disabled = !CAM.ready;
  $('btest').disabled = !S.model;
  $('brun').disabled = !S.model || !S.files.length;
  $('brev').disabled = !S.rec.length;
}

/* ── camera + face landmarker ── */
const CAM = { on: false, ready: false, fl: null, video: $('cam'), lastT: -1, lm: null };
async function loadVision() {
  try { return await import(MP + '/vision_bundle.mjs'); } catch (e) { return await import(MP + '/+esm'); }
}
async function startCam() {
  if (CAM.on) return;
  log('Starting the camera ...');
  try {
    const st = await navigator.mediaDevices.getUserMedia({ video: { width: { ideal: 1280 }, height: { ideal: 720 }, facingMode: 'user' }, audio: false });
    CAM.video.srcObject = st; await CAM.video.play(); CAM.on = true;
  } catch (e) { log(`<span class="bad">Camera: ${e.message}</span> (allow camera access; some browsers need http://localhost instead of file://)`); return; }
  log('Loading the face landmarker (MediaPipe, about 4 MB) ...'); hud();
  try {
    const V = await loadVision(), vis = V.FilesetResolver ? V : V.default;
    const fs = await vis.FilesetResolver.forVisionTasks(MP + '/wasm');
    const mk = (delegate) => vis.FaceLandmarker.createFromOptions(fs, { baseOptions: { modelAssetPath: MODEL, delegate }, runningMode: 'VIDEO', numFaces: 1,
      outputFacialTransformationMatrixes: true, outputFaceBlendshapes: true });
    try { CAM.fl = await mk('GPU'); } catch (e) { CAM.fl = await mk('CPU'); }
    CAM.ready = true;
    log('<span class="ok">Tracking.</span> Sit at a normal distance, face the screen, keep your head still. Then <b>Calibrate</b>.');
  } catch (e) { log(`<span class="bad">Face landmarker failed: ${e.message}</span>`); }
  hud(); buildLeft();
}

/* ── features ── */
// eye: corners on the image-left / image-right side, lids, iris ring (centre + 4)
const EYES = [{ a: 33, b: 133, t: 159, bo: 145, iris: [468, 469, 470, 471, 472] }, { a: 362, b: 263, t: 386, bo: 374, iris: [473, 474, 475, 476, 477] }];
function eyeFeat(lm, W, H, E) {
  const P = (i) => [lm[i].x * W, lm[i].y * H];
  const A = P(E.a), B = P(E.b), T = P(E.t), D = P(E.bo);
  let ix = 0, iy = 0; for (const k of E.iris) { const p = P(k); ix += p[0]; iy += p[1]; } ix /= E.iris.length; iy /= E.iris.length;
  const ax = B[0] - A[0], ay = B[1] - A[1], w = Math.hypot(ax, ay) || 1, ux = ax / w, uy = ay / w, nx = -uy, ny = ux;
  const mx = (A[0] + B[0]) / 2, my = (A[1] + B[1]) / 2, dx = ix - mx, dy = iy - my;
  return { ex: (dx * ux + dy * uy) / w, ey: (dx * nx + dy * ny) / w, open: ((D[0] - T[0]) * nx + (D[1] - T[1]) * ny) / w };
}
function features(r) {
  const lm = r.faceLandmarks && r.faceLandmarks[0];
  if (!lm || lm.length < 478) return null;
  const W = CAM.video.videoWidth, H = CAM.video.videoHeight, e0 = eyeFeat(lm, W, H, EYES[0]), e1 = eyeFeat(lm, W, H, EYES[1]);
  let yaw = 0, pitch = 0, tx = 0, ty = 0, tz = -60;
  const M = r.facialTransformationMatrixes && r.facialTransformationMatrixes[0];
  if (M && M.data) { const m = M.data; yaw = Math.atan2(m[8], m[10]); pitch = Math.atan2(-m[9], Math.hypot(m[8], m[10])); tx = m[12]; ty = m[13]; tz = m[14]; }
  let blink = false;
  const bs = r.faceBlendshapes && r.faceBlendshapes[0];
  if (bs) for (const c of bs.categories) if ((c.categoryName === 'eyeBlinkLeft' || c.categoryName === 'eyeBlinkRight') && c.score > 0.45) blink = true;
  return { ex: (e0.ex + e1.ex) / 2, ey: (e0.ey + e1.ey) / 2, open: (e0.open + e1.open) / 2, yaw, pitch, tx, ty, tz, blink, lm };
}
const effEye = (f) => [f.ex + S.opt.head * 0.4 * f.yaw, f.ey + S.opt.head * 0.4 * f.pitch];

/* ── the gaze model ── */
function basis(e, kind) { const [x, y] = e; const b = [x, y, x * y]; if (kind === '9') b.push(x * x, y * y); return b; }
function solve(A, b) {                          // Gauss, partial pivot
  const n = b.length, M = A.map((r, i) => [...r, b[i]]);
  for (let c = 0; c < n; c++) {
    let p = c; for (let r = c + 1; r < n; r++) if (Math.abs(M[r][c]) > Math.abs(M[p][c])) p = r;
    [M[c], M[p]] = [M[p], M[c]];
    const d = M[c][c] || 1e-12;
    for (let r = 0; r < n; r++) if (r !== c) { const f = M[r][c] / d; for (let k = c; k <= n; k++) M[r][k] -= f * M[c][k]; }
  }
  return M.map((r, i) => r[n] / (M[i][i] || 1e-12));
}
const median = (a) => { const s = [...a].sort((x, y) => x - y), n = s.length; return n ? (n % 2 ? s[(n - 1) / 2] : (s[n / 2 - 1] + s[n / 2]) / 2) : 0; };
// samples: [{e: [ex, ey], x, y}] (x, y normalised targets)
function fit(samples, kind, nTargets) {
  // drop outliers per target (3 MAD on each eye coordinate)
  const byT = new Map();
  for (const s of samples) { const k = s.x.toFixed(3) + ',' + s.y.toFixed(3); if (!byT.has(k)) byT.set(k, []); byT.get(k).push(s); }
  const keep = [];
  for (const g of byT.values()) {
    const ok = (j) => { const v = g.map((s) => s.e[j]), m = median(v), mad = median(v.map((x) => Math.abs(x - m))) || 1e-4; return (s) => Math.abs(s.e[j] - m) <= 3 * 1.4826 * mad; };
    const o0 = ok(0), o1 = ok(1);
    for (const s of g) if (o0(s) && o1(s)) keep.push(s);
  }
  const X = keep.map((s) => basis(s.e, kind)), P = X[0].length;
  const mu = Array(P).fill(0), sd = Array(P).fill(0);
  for (const r of X) r.forEach((v, j) => (mu[j] += v / X.length));
  for (const r of X) r.forEach((v, j) => (sd[j] += (v - mu[j]) ** 2 / X.length));
  for (let j = 0; j < P; j++) sd[j] = Math.sqrt(sd[j]) || 1;
  const Z = X.map((r) => [1, ...r.map((v, j) => (v - mu[j]) / sd[j])]), Q = P + 1, lam = 1e-3 * Z.length;
  const W = [];
  for (const axis of ['x', 'y']) {
    const A = Array.from({ length: Q }, () => Array(Q).fill(0)), b = Array(Q).fill(0);
    Z.forEach((z, i) => { const t = keep[i][axis]; for (let a = 0; a < Q; a++) { b[a] += z[a] * t; for (let c = 0; c < Q; c++) A[a][c] += z[a] * z[c]; } });
    for (let a = 1; a < Q; a++) A[a][a] += lam;
    W.push(solve(A, b));
  }
  const head = { tx: median(keep.map((s) => s.tx)), ty: median(keep.map((s) => s.ty)), tz: median(keep.map((s) => s.tz)) };
  return { kind, nTargets, mu, sd, W, off: [0, 0], head, n: keep.length, dropped: samples.length - keep.length, err: null };
}
function predict(m, e) {
  const z = [1, ...basis(e, m.kind).map((v, j) => (v - m.mu[j]) / m.sd[j])];
  const dot = (w) => w.reduce((a, v, i) => a + v * z[i], 0);
  return [Math.max(-0.25, Math.min(1.25, dot(m.W[0]) + m.off[0])), Math.max(-0.25, Math.min(1.25, dot(m.W[1]) + m.off[1]))];
}

/* ── One Euro filter ── */
function oneEuro() {
  let xp = null, dxp = 0, tp = 0;
  const al = (c, dt) => { const r = 2 * Math.PI * c * dt; return r / (r + 1); };
  return (x, t) => {
    if (xp === null) { xp = x; tp = t; return x; }
    const dt = Math.max(1e-3, (t - tp) / 1000); tp = t;
    if (dt > 0.3) { xp = x; dxp = 0; return x; }
    const mc = 0.05 + 4 * Math.pow(1 - S.opt.smooth, 2), dx = (x - xp) / dt;
    dxp += al(1, dt) * (dx - dxp);
    xp += al(mc + 0.6 * Math.abs(dxp), dt) * (x - xp);
    return xp;
  };
}
const FX = oneEuro(), FY = oneEuro();

/* ── the frame loop ── */
const BUF = [];                                   // recent frames: {t, f, p (raw), g (smoothed)}
let fpsN = 0, fpsT = performance.now(), GAZE = null;
function tick() {
  requestAnimationFrame(tick);
  const v = CAM.video;
  if (CAM.ready && v.readyState >= 2 && v.currentTime !== CAM.lastT) {
    CAM.lastT = v.currentTime;
    const now = performance.now();
    let f = null;
    try { f = features(CAM.fl.detectForVideo(v, now)); } catch (e) { /* skip frame */ }
    FACE = !!f; BLINK = !!(f && f.blink);
    const fr = { t: now, f, p: null, g: null };
    if (f && S.model) {
      fr.p = predict(S.model, effEye(f));
      if (!f.blink) fr.g = [FX(fr.p[0], now), FY(fr.p[1], now)];
    }
    if (fr.g) GAZE = fr; else if (!f) GAZE = null;
    BUF.push(fr); while (BUF.length && BUF[0].t < now - 4000) BUF.shift();
    CAM.lm = f;
    fpsN++;
    if (now - fpsT > 1000) { FPS = fpsN * 1000 / (now - fpsT); fpsN = 0; fpsT = now; hud(); }
    if (STAGE.onFrame) STAGE.onFrame(fr);
    if (S.view === 'setup') drawCam();
  }
  if (STAGE.draw) STAGE.draw();
}
requestAnimationFrame(tick);

/* ── setup view: the camera with eye overlay ── */
function fitCanvas(c, el) { const r = el.getBoundingClientRect(), k = devicePixelRatio || 1; c.width = Math.max(2, r.width * k); c.height = Math.max(2, r.height * k); c.style.left = '0px'; c.style.top = '0px'; c.style.width = r.width + 'px'; c.style.height = r.height + 'px'; return k; }
function drawCam() {
  const c = $('cv'), g = c.getContext('2d'), k = fitCanvas(c, $('view')), v = CAM.video;
  $('ov').getContext('2d').clearRect(0, 0, $('ov').width, $('ov').height);
  g.fillStyle = '#080b0f'; g.fillRect(0, 0, c.width, c.height);
  if (!CAM.on || !v.videoWidth) { g.fillStyle = '#7a8794'; g.font = `${11 * k}px monospace`; g.textAlign = 'center'; g.fillText('Camera off · press 1 · Camera', c.width / 2, c.height / 2); return; }
  const s = Math.min(c.width / v.videoWidth, c.height / v.videoHeight) * 0.92, w = v.videoWidth * s, h = v.videoHeight * s, x0 = (c.width - w) / 2, y0 = (c.height - h) / 2;
  g.save(); g.translate(x0 + w, y0); g.scale(-1, 1); g.globalAlpha = 0.85; g.drawImage(v, 0, 0, w, h); g.restore();
  const f = CAM.lm;
  if (f) {
    const P = (i) => [x0 + w - f.lm[i].x * w, y0 + f.lm[i].y * h];
    for (const E of EYES) {
      g.strokeStyle = 'rgba(143,200,232,0.8)'; g.lineWidth = k;
      g.beginPath(); for (const i of [E.a, E.t, E.b, E.bo, E.a]) { const p = P(i); i === E.a && g.moveTo(...p); g.lineTo(...p); } g.stroke();
      const p = P(E.iris[0]); g.fillStyle = f.blink ? '#e8896f' : '#e8c86f'; g.beginPath(); g.arc(p[0], p[1], 2.5 * k, 0, 7); g.fill();
    }
    // eye-feature readout and a little gaze map

  const smp = rec.samples.filter(inWin);

  if (O.raw) { g.fillStyle = 'rgba(232,200,111,0.35)'; for (const s of smp) if (s.ok) g.fillRect(box.x + s.u * box.w - 1, box.y + s.v * box.h - 1, 2, 2); }
  if (O.path) {
    const F = (rec.fix || []).filter((f) => !isV || (f.vt !== null && f.vt >= t - O.win && f.vt <= t + 0.04));
    g.strokeStyle = 'rgba(230,236,242,0.6)'; g.lineWidth = 1.2; g.beginPath();
    F.forEach((f, i) => { const x = box.x + f.u * box.w, y = box.y + f.v * box.h; i ? g.lineTo(x, y) : g.moveTo(x, y); }); g.stroke();
    g.font = '10px monospace'; g.textAlign = 'center'; g.textBaseline = 'middle';
    F.forEach((f, i) => {
      const x = box.x + f.u * box.w, y = box.y + f.v * box.h, r = 5 + Math.sqrt(f.d) * 0.6;
      g.fillStyle = 'rgba(143,200,232,0.35)'; g.strokeStyle = 'rgba(143,200,232,0.95)'; g.beginPath(); g.arc(x, y, r, 0, 7); g.fill(); g.stroke();
      g.fillStyle = '#e6ecf2'; g.fillText(String(i + 1), x, y);
    });
  }
  if (isV) {                                        // the gaze at the playhead
    let best = null; for (const s of rec.samples) if (s.ok && s.vt !== null && Math.abs(s.vt - t) < 0.08 && (!best || Math.abs(s.vt - t) < Math.abs(best.vt - t))) best = s;
    if (best) { g.strokeStyle = '#e8c86f'; g.lineWidth = 2; g.beginPath(); g.arc(box.x + best.u * box.w, box.y + best.v * box.h, 12, 0, 7); g.stroke(); }
  }
}
function drawReview() {
  if (!RV || S.view !== 'review') return;
  const c = $('ov'), k = fitCanvas(c, $('view')), g = c.getContext('2d');
  g.setTransform(k, 0, 0, k, 0, 0); g.clearRect(0, 0, c.width, c.height);
  if (RV.missing) { g.strokeStyle = 'rgba(230,236,242,0.15)'; g.strokeRect(RV.box.x, RV.box.y, RV.box.w, RV.box.h); }
  const t = RV.rec.type === 'video' ? RV.el.currentTime || 0 : 0;
  drawOverlay(g, RV.rec, RV.box, t);
}
(function rl() { if (S.view === 'review' && RV && RV.el.tagName === 'VIDEO' && !RV.el.paused) drawReview(); requestAnimationFrame(rl); })();
addEventListener('resize', () => { if (S.view === 'review') layoutReview(); });

/* ── export ── */
function download(blob, name) { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 4000); }
const stamp = () => new Date().toISOString().slice(0, 19).replace(/[:T]/g, '-');
function exportCSV() {
  const L = ['file,type,t_ms,video_s,valid,blink,x_px,y_px,raw_x_px,raw_y_px,u,v,screen_w,screen_h'];
  for (const r of S.rec) for (const s of r.samples) L.push([JSON.stringify(r.name), r.type, s.t, s.vt ?? '', s.ok ? 1 : 0, s.blink ? 1 : 0, s.x ?? '', s.y ?? '', s.rx ?? '', s.ry ?? '', s.u ?? '', s.v ?? '', r.sw, r.sh].join(','));
  download(new Blob([L.join('\n')], { type: 'text/csv' }), `itrack_samples_${stamp()}.csv`);
  const F = ['file,index,t_ms,video_s,duration_ms,x_px,y_px,u,v'];
  for (const r of S.rec) (r.fix || []).forEach((f, i) => F.push([JSON.stringify(r.name), i + 1, f.t, f.vt ?? '', f.d, f.x, f.y, f.u, f.v].join(',')));
  setTimeout(() => download(new Blob([F.join('\n')], { type: 'text/csv' }), `itrack_fixations_${stamp()}.csv`), 300);
}
function exportJSON() {
  const m = S.model;
  const o = { app: 'iTrack', version: 'v001', created: new Date().toISOString(), options: S.opt,
    calibration: m ? { kind: m.kind, targets: m.nTargets, frames: m.n, error_px: m.err ? m.err.px : null, precision_px: m.err ? m.err.prec : null, error_deg: m.err ? m.err.deg : null } : null,
    files: S.rec.map((r) => ({ name: r.name, type: r.type, width: r.nw, height: r.nh, rect: r.rect, screen: [r.sw, r.sh], duration_ms: Math.round(r.dur), drift: r.drift, stats: stats(r), fixations: r.fix, samples: r.samples })) };
  download(new Blob([JSON.stringify(o)], { type: 'application/json' }), `itrack_session_${stamp()}.json`);
}
function exportPNG() {
  if (!RV) return;
  const rec = RV.rec, w = rec.nw, h = rec.nh, c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d');
  g.fillStyle = '#000'; g.fillRect(0, 0, w, h);
  if (!RV.missing) try { g.drawImage(RV.el, 0, 0, w, h); } catch (e) { /* no frame */ }
  const k = w / RV.box.w; g.save(); g.scale(k, k);
  drawOverlay(g, rec, { x: 0, y: 0, w: RV.box.w, h: RV.box.h }, rec.type === 'video' ? RV.el.currentTime || 0 : 0);
  g.restore();
  c.toBlob((b) => download(b, `itrack_${rec.name.replace(/\.[^.]+$/, '')}_${S.opt.heat ? 'heat' : ''}${S.opt.path ? 'path' : ''}.png`), 'image/png');
}
function loadSession(file) {
  const rd = new FileReader();
  rd.onload = () => {
    try {
      const o = JSON.parse(rd.result);
      S.rec = o.files.map((f) => ({ name: f.name, type: f.type, nw: f.width, nh: f.height, rect: f.rect, sw: f.screen[0], sh: f.screen[1], dur: f.duration_ms, drift: f.drift, samples: f.samples, fix: f.fixations }));
      for (const r of S.rec) if (!r.fix) r.fix = fixations(r);
      S.sel = 0; log(`Session loaded: ${S.rec.length} file(s). Add the same files to see them under the gaze.`); hud(); showReview();
    } catch (e) { log(`<span class="bad">Not an iTrack session: ${e.message}</span>`); }
  };
  rd.readAsText(file);
}

/* ── files ── */
function addFiles(list) {
  for (const f of list) {
    const type = f.type.startsWith('video') ? 'video' : f.type.startsWith('image') ? 'image' : null;
    if (!type) continue;
    if (S.files.some((x) => x.name === f.name && x.size === f.size)) continue;
    S.files.push({ name: f.name, type, size: f.size, url: URL.createObjectURL(f) });
  }
  log(`${S.files.length} file(s) in the sequence.`); hud(); buildLeft();
  if (S.view === 'review' && RV && RV.missing) openRec(S.sel);
}
$('fin').addEventListener('change', (e) => { addFiles(e.target.files); e.target.value = ''; });
$('jin').addEventListener('change', (e) => { if (e.target.files[0]) loadSession(e.target.files[0]); e.target.value = ''; });
addEventListener('dragover', (e) => { e.preventDefault(); });
addEventListener('drop', (e) => { e.preventDefault(); if (e.dataTransfer.files.length) addFiles(e.dataTransfer.files); });

/* ── UI helpers ── */
const h = (tag, cls, txt) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt !== undefined) e.innerHTML = txt; return e; };
function grp(L, t) { L.appendChild(h('div', 'grp', t)); }
function note(L, t) { L.appendChild(h('div', 'note', t)); }
function slider(L, label, min, max, step, key, fmt, cb) {
  const r = h('div', 'row sl'), lb = h('label', '', label), inp = document.createElement('input'), v = h('div', 'v');
  Object.assign(inp, { type: 'range', min, max, step, value: S.opt[key] });
  const show = () => (v.textContent = fmt ? fmt(S.opt[key]) : S.opt[key]);
  inp.addEventListener('input', () => { S.opt[key] = +inp.value; show(); saveOpt(); if (cb) cb(); });
  inp.addEventListener('dblclick', () => { S.opt[key] = OPT_DEF[key]; inp.value = OPT_DEF[key]; show(); saveOpt(); if (cb) cb(); });
  show(); r.append(lb, inp, v); L.appendChild(r);
}
function check(L, label, key, cb) {
  const r = h('div', 'chk'), id = 'c_' + key, inp = document.createElement('input');
  Object.assign(inp, { type: 'checkbox', id, checked: !!S.opt[key] });
  inp.addEventListener('change', () => { S.opt[key] = inp.checked; saveOpt(); if (cb) cb(); });
  const lb = h('label', '', label); lb.htmlFor = id; r.append(inp, lb); L.appendChild(r);
}
function select(L, label, opts, key, cb) {
  const r = h('div', 'row kv'), s = document.createElement('select');
  s.innerHTML = opts.map(([v, t]) => `<option value="${v}">${t}</option>`).join(''); s.value = String(S.opt[key]);
  s.addEventListener('change', () => { S.opt[key] = s.value; saveOpt(); if (cb) cb(); });
  r.append(h('label', '', label), s); L.appendChild(r);
}
function buttons(L, list) { const r = h('div', 'btns'); for (const [t, fn] of list) { const b = h('button', '', t); b.type = 'button'; b.addEventListener('click', fn); r.appendChild(b); } L.appendChild(r); }
function kv(L, k, v) { const r = h('div', 'row kv'); r.append(h('label', '', k), h('div', 'v', v)); L.appendChild(r); }

/* ── left panel ── */
function buildLeft() {
  const L = $('left'), top = L.scrollTop; L.innerHTML = '';
  if (S.view === 'review') return buildReviewPanel(L, top);
  grp(L, 'Files · in playing order');
  const d = h('div', 'drop', 'Add images / videos · or drop them here'); d.addEventListener('click', () => $('fin').click()); L.appendChild(d);
  if (S.files.length) {
    const ls = h('div', 'list');
    S.files.forEach((f, i) => {
      const it = h('div', 'item');
      const up = h('span', 'x', '↑'), dn = h('span', 'x', '↓'), rm = h('span', 'x', '×');
      up.title = 'Earlier'; dn.title = 'Later'; rm.title = 'Remove';
      up.onclick = () => { if (i) { [S.files[i - 1], S.files[i]] = [S.files[i], S.files[i - 1]]; buildLeft(); } };
      dn.onclick = () => { if (i < S.files.length - 1) { [S.files[i + 1], S.files[i]] = [S.files[i], S.files[i + 1]]; buildLeft(); } };
      rm.onclick = () => { URL.revokeObjectURL(f.url); S.files.splice(i, 1); hud(); buildLeft(); };
      it.append(h('span', 'ty', String(i + 1).padStart(2, '0')), h('span', 'nm', f.name), h('span', 'ty', f.type), up, dn, rm);
      ls.appendChild(it);
    });
    L.appendChild(ls);
    buttons(L, [['Clear all', () => { for (const f of S.files) URL.revokeObjectURL(f.url); S.files = []; hud(); buildLeft(); }]]);
  }
  grp(L, 'Playback');
  slider(L, 'Image duration (s)', 1, 30, 0.5, 'imgDur');
  slider(L, 'Gap between files (s)', 0, 3, 0.1, 'gap');
  check(L, 'Mute videos', 'mute');
  check(L, 'Drift check before each file', 'drift');
  check(L, 'Show my gaze while playing', 'showGaze');
  note(L, 'Videos play to their end. During the run: Space at the cross (drift check), → or N skips a file, Esc stops (what was recorded is kept).');
  grp(L, 'Calibration');
  select(L, 'Targets', [['4', '4 corners'], ['9', '9 · corners, edges, centre']], 'calib');
  slider(L, 'Rounds', 1, 3, 1, 'rounds');
  slider(L, 'Corner inset (px)', 10, 150, 1, 'inset');
  slider(L, 'Smoothing', 0, 1, 0.01, 'smooth', (v) => v.toFixed(2));
  slider(L, 'Head compensation', -2, 2, 0.05, 'head', (v) => v.toFixed(2));
  note(L, 'Calibrate: look at each dot and click it while looking. Every click takes the frames 0.4 s before and after it. 9 targets fit a curved map and are usually more accurate. Head compensation adds head turning to the eye signal; try it in Test gaze by fixating a cross and turning your head: pick the sign and size that keep the dot still. Recalibrate after changing it.');
  if (S.model) {
    grp(L, 'Calibration result');
    kv(L, 'Targets / frames', `${S.model.nTargets} / ${S.model.n}`);
    if (S.model.err) { kv(L, 'Accuracy', `${S.model.err.px.toFixed(0)} px · ${S.model.err.deg.toFixed(1)}°`); kv(L, 'Precision', `${S.model.err.prec.toFixed(0)} px`); }
    kv(L, 'Head distance', `${Math.abs(S.model.head.tz).toFixed(0)} cm`);
  }
  grp(L, 'Earlier sessions');
  buttons(L, [['Load session JSON', () => $('jin').click()]]);
  if (S.rec.length) buttons(L, [['Review last run', showReview]]);
  note(L, 'Everything runs in this browser: the camera image and your files are not uploaded. MediaPipe and its face model are loaded from the CDN once.');
  L.scrollTop = top;
}
function buildReviewPanel(L, top) {
  grp(L, 'Recorded files');
  const ls = h('div', 'list');
  S.rec.forEach((r, i) => {
    const st = stats(r), it = h('div', 'item' + (i === S.sel ? ' sel' : ''));
    it.append(h('span', 'ty', String(i + 1).padStart(2, '0')), h('span', 'nm', r.name), h('span', 'ty', `${(st.valid * 100).toFixed(0)}%`));
    it.onclick = () => openRec(i);
    ls.appendChild(it);
  });
  L.appendChild(ls);
  const r = S.rec[S.sel];
  if (r) {
    const st = stats(r);
    grp(L, 'This file');
    kv(L, 'Duration', `${(r.dur / 1000).toFixed(1)} s · ${st.hz.toFixed(0)} Hz`);
    kv(L, 'Valid samples', `${(st.valid * 100).toFixed(0)} % of ${st.n}`);
    kv(L, 'Gaze on the media', `${(st.onMedia * 100).toFixed(0)} %`);
    kv(L, 'Fixations', `${st.fix} · mean ${st.meanFix.toFixed(0)} ms`);
  }
  grp(L, 'Display');
  check(L, 'Heatmap', 'heat', drawReview);
  check(L, 'Scanpath (fixations)', 'path', drawReview);
  check(L, 'Raw samples', 'raw', drawReview);
  slider(L, 'Heat radius (px)', 8, 150, 1, 'radius', null, drawReview);
  slider(L, 'Heat opacity', 0.1, 1, 0.01, 'alpha', (v) => v.toFixed(2), drawReview);
  slider(L, 'Video window (s)', 0.2, 10, 0.1, 'win', (v) => v.toFixed(1), drawReview);
  grp(L, 'Fixations');
  const refix = () => { for (const q of S.rec) q.fix = fixations(q); buildLeft(); drawReview(); };
  slider(L, 'Dispersion (px)', 20, 200, 1, 'disp', null, refix);
  slider(L, 'Min duration (ms)', 50, 400, 10, 'minFix', null, refix);
  note(L, 'A fixation: consecutive samples that stay inside the dispersion (x range + y range, in screen px) for at least the minimum duration. On videos, heatmap and scanpath show the window before the playhead.');
  grp(L, 'Export');
  buttons(L, [['CSV', exportCSV], ['JSON', exportJSON], ['PNG', exportPNG]]);
  note(L, 'CSV: every sample (screen px, raw and smoothed, and u / v inside the media, 0..1) plus a fixation table. JSON: the whole session, loadable here later. PNG: the current view at the media resolution.');
  buttons(L, [['Back to setup', () => { if (RV && RV.el) { if (RV.el.pause) RV.el.pause(); RV.el.remove(); } RV = null; S.view = 'setup'; $('ov').getContext('2d').clearRect(0, 0, $('ov').width, $('ov').height); buildLeft(); }]]);
  L.scrollTop = top;
}

/* ── top bar ── */
$('bcam').addEventListener('click', startCam);
$('bcal').addEventListener('click', calibrate);
$('btest').addEventListener('click', testGaze);
$('brun').addEventListener('click', run);
$('brev').addEventListener('click', showReview);
addEventListener('resize', () => { if (S.view === 'setup') drawCam(); });

buildLeft(); hud(); drawCam();
log('Add your files, then <b>1 · Camera</b>, <b>2 · Calibrate</b>, <b>3 · Run</b>.');
</script>
</body>
</html>
