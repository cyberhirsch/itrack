<style>
  :root{
    --bg:#05070a; --ink:#e6ecf2; --dim:#7a8794; --accent:#8fc8e8; --warm:#e8c86f; --ok:#7fd6a2; --bad:#e8896f; --line:rgba(230,236,242,0.10);

  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:var(--bg);color:var(--ink);

  .panel::-webkit-scrollbar{width:4px}
  .panel::-webkit-scrollbar-thumb{background:var(--line)}
  #top{grid-column:1/-1;display:flex;align-items:center;gap:18px;flex-wrap:wrap;padding:11px 15px}

<body>
<div id="ui">
  <div id="top" class="panel">

<script type="module">
/* ═══════════════════════════════════════════════════════════════════════
   № 27 — iTrack · v002

   Webcam eye tracking in the browser. Load images and videos, calibrate,
   then the files play in sequence (fullscreen) while the gaze is recorded;
   review as heatmap and scanpath, export CSV / JSON / PNG. Nothing leaves
   the browser. Landmarks: MediaPipe Face Landmarker (Apache-2.0).

   v002, after EyeTrax (github.com/ck-zhang/eyetrax, MIT) and the request
   to track head rotation and to crop and enlarge the head:
   - head crop: the face is tracked as a square region of interest in the
     full-resolution camera frame (1920 x 1080 asked for); that region is
     cut out and enlarged to the crop resolution and the landmarker runs on
     it, so the face fills the network input wherever it sits in the frame;
     landmarks are mapped back exactly. Lost face: one full-frame pass.
   - eye crops: each eye, rotated level, is cut from the full-resolution
     frame and enlarged; the iris centre is refined there as the centroid
     of the darkest pixels inside the eye opening and mixed with the
     landmark iris (Iris refine).
   - head pose from the landmarks themselves (EyeTrax's frame): x along the
     eye corners, y towards the forehead, z their cross product; yaw, pitch,
     roll, face centre and scale (inter-eye distance), One-Euro smoothed.
   - head compensation is LEARNED: the head pose goes into the regression,
     and a head sweep (look at the centre dot, turn the head slowly) gives
     the frames where the target stays and the head moves - exactly what
     the regression needs to cancel head rotation.
   - smooth pursuit (Lissajous, after EyeTrax): many targets in seconds.
   - two models: Iris offset (bilinear / quadratic in ex, ey) or Eye region
     (EyeTrax features: 161 landmarks around the eyes and face, in the head
     frame, divided by the inter-eye distance; ridge on standardised
     features), both plus the head pose.
   - blink: eye aspect ratio below 0.8 x its running mean (EyeTrax), or the
     blink blendshape.
   - smoothing: One Euro or a constant-velocity Kalman filter whose
     measurement noise comes from the validation precision (EyeTrax tunes
     its Kalman the same way), or none.
   - the calibration is saved in the browser and can be reused.
   ═══════════════════════════════════════════════════════════════════════ */
'use strict';
const $ = (id) => document.getElementById(id);
const MP = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14';
const MODEL = 'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task';

/* ── state ── */
const OPT_DEF = { imgDur: 5, mute: true, drift: true, gap: 0.5, showGaze: false,
  crop: true, cropRes: 512, refine: 0.5,
  calib: '4', rounds: 2, inset: 40, autoCal: false, sweep: true, sweepDur: 10, pursuit: true, pursuitDur: 8, lag: 100,
  ft: 'rich', lam10: 0,
  filter: 'euro', smooth: 0.6, kq: 1.3,
  radius: 45, disp: 70, minFix: 100, win: 1.5, heat: true, path: true, raw: false, alpha: 0.65 };
const S = { files: [], opt: { ...OPT_DEF }, model: null, rec: [], sel: 0, view: 'setup' };
try { Object.assign(S.opt, JSON.parse(localStorage.getItem('itrack.v002.opt') || '{}')); } catch (e) { /* storage off */ }
const saveOpt = () => { try { localStorage.setItem('itrack.v002.opt', JSON.stringify(S.opt)); } catch (e) { /* storage off */ } };
const savedModel = () => { try { return JSON.parse(localStorage.getItem('itrack.v002.model') || 'null'); } catch (e) { return null; } };

/* ── log / hud ── */
function log(t) { const d = $('diag'); d.innerHTML = t + '<br>' + d.innerHTML.split('<br>').slice(0, 4).join('<br>'); }
let FPS = 0, FACE = false, BLINK = false;
function hud() {
  const m = S.model, f = CAM.lm;
  $('hud').innerHTML = `camera <b>${CAM.on ? CAM.video.videoWidth + '×' + CAM.video.videoHeight : 'off'}</b> · face <b class="${FACE ? 'ok' : 'bad'}">${FACE ? (BLINK ? 'blink' : 'yes') : 'no'}</b> · <b>${FPS.toFixed(0)}</b> fps`
    + (f ? ` · head <b>${(f.yaw * 57.3).toFixed(0)}° ${(f.pitch * 57.3).toFixed(0)}° ${(f.roll * 57.3).toFixed(0)}°</b>` : '') + '<br>'
    + `calibration <b>${m ? `${m.ft === 'rich' ? 'eye region' : 'iris'} · ${m.head ? 'head comp.' : 'no head comp.'} · ${m.err ? m.err.px.toFixed(0) + ' px' : 'not validated'}` : 'none'}</b> · files <b>${S.files.length}</b> · recorded <b>${S.rec.length}</b>`;
  $('bcal').disabled = !CAM.ready;
  $('btest').disabled = !S.model;
  $('brun').disabled = !S.model || !S.files.length;
  $('brev').disabled = !S.rec.length;
}

/* ── camera + two face landmarkers (full frame, head crop) ── */
const CAM = { on: false, ready: false, fl: null, flC: null, video: $('cam'), lastT: -1, lm: null };
async function loadVision() {
  try { return await import(MP + '/vision_bundle.mjs'); } catch (e) { return await import(MP + '/+esm'); }
}
async function startCam() {
  if (CAM.on) return;
  log('Starting the camera ...');
  try {
    const st = await navigator.mediaDevices.getUserMedia({ video: { width: { ideal: 1920 }, height: { ideal: 1080 }, frameRate: { ideal: 30 }, facingMode: 'user' }, audio: false });
    CAM.video.srcObject = st; await CAM.video.play(); CAM.on = true;
  } catch (e) { log(`<span class="bad">Camera: ${e.message}</span> (allow camera access; some browsers need http://localhost instead of file://)`); return; }
  log(`Camera ${CAM.video.videoWidth} × ${CAM.video.videoHeight}. Loading the face landmarker (MediaPipe, about 4 MB) ...`); hud();
  try {
    const V = await loadVision(), vis = V.FilesetResolver ? V : V.default;
    const fs = await vis.FilesetResolver.forVisionTasks(MP + '/wasm');
    const mk = async () => {
      const o = (delegate) => ({ baseOptions: { modelAssetPath: MODEL, delegate }, runningMode: 'VIDEO', numFaces: 1, outputFaceBlendshapes: true,
        minFaceDetectionConfidence: 0.5, minFacePresenceConfidence: 0.5, minTrackingConfidence: 0.5 });
      try { return await vis.FaceLandmarker.createFromOptions(fs, o('GPU')); } catch (e) { return await vis.FaceLandmarker.createFromOptions(fs, o('CPU')); }
    };
    CAM.fl = await mk(); CAM.flC = await mk();
    CAM.ready = true;
    log('<span class="ok">Tracking.</span> Sit at a normal distance, face the screen. Then <b>Calibrate</b>.');
  } catch (e) { log(`<span class="bad">Face landmarker failed: ${e.message}</span>`); }
  hud(); buildLeft();
}

/* ── landmark index sets ── */
// eye: corners on the image-left / image-right side, lids, iris ring (centre + 4), eye-opening contour
const EYES = [{ a: 33, b: 133, t: 159, bo: 145, iris: [468, 469, 470, 471, 472] }, { a: 362, b: 263, t: 386, bo: 374, iris: [473, 474, 475, 476, 477] }];
// EyeTrax (MIT): left eye region, right eye region, face reference points - 161 landmarks
const RICH = [107, 66, 105, 63, 70, 55, 65, 52, 53, 46, 468, 469, 470, 471, 472, 133, 33, 173, 157, 158, 159, 160, 161, 246, 155, 154, 153, 145, 144, 163, 7, 243, 190, 56, 28, 27, 29, 30, 247, 130, 25, 110, 24, 23, 22, 26, 112, 244, 189, 221, 222, 223, 224, 225, 113, 226, 31, 228, 229, 230, 231, 232, 233, 193, 245, 128, 121, 120, 119, 118, 117, 111, 35, 124, 143, 156,
  336, 296, 334, 293, 300, 285, 295, 282, 283, 276, 473, 476, 475, 474, 477, 362, 263, 398, 384, 385, 386, 387, 388, 466, 382, 381, 380, 374, 373, 390, 249, 463, 414, 286, 258, 257, 259, 260, 467, 359, 255, 339, 254, 253, 252, 256, 341, 464, 413, 441, 442, 443, 444, 445, 342, 446, 261, 448, 449, 450, 451, 452, 453, 417, 465, 357, 350, 349, 348, 347, 346, 340, 265, 353, 372, 383,
  4, 10, 151, 9, 152, 234, 454, 58, 288];

/* ── head crop: region of interest in the full frame ── */
const ROI = { ok: false, x: 0, y: 0, s: 0 };
const CROP = document.createElement('canvas');
function updateRoi(P, W, H) {                      // P: full-frame px points
  let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
  for (const p of P) { if (p[0] < x0) x0 = p[0]; if (p[0] > x1) x1 = p[0]; if (p[1] < y0) y0 = p[1]; if (p[1] > y1) y1 = p[1]; }
  const s = Math.max(x1 - x0, y1 - y0) * 1.6, cx = (x0 + x1) / 2, cy = (y0 + y1) / 2;
  if (!ROI.ok) Object.assign(ROI, { ok: true, x: cx - s / 2, y: cy - s / 2, s });
  else { const a = 0.35, ns = ROI.s + a * (s - ROI.s), ox = ROI.x + ROI.s / 2, oy = ROI.y + ROI.s / 2, nx = ox + a * (cx - ox), ny = oy + a * (cy - oy); Object.assign(ROI, { x: nx - ns / 2, y: ny - ns / 2, s: ns }); }
  if (ROI.s < 40 || ROI.s > 3 * Math.max(W, H)) ROI.ok = false;
}

/* ── eye crops: each eye levelled, cut from the full frame and enlarged ── */
const EW = 120, EH = 60;
const EC = [0, 1].map(() => { const c = document.createElement('canvas'); c.width = EW; c.height = EH; return c; });
const ECX = EC.map((c) => c.getContext('2d'));            // small GPU canvases: only 120 x 60 is read back
// returns the refined iris centre in full-frame px, or null
function refineIris(k, P, E) {
  const v = CAM.video, A = P(E.a), B = P(E.b), T = P(E.t), D = P(E.bo);
  const ax = B[0] - A[0], ay = B[1] - A[1], w = Math.hypot(ax, ay) || 1, ang = Math.atan2(ay, ax), mx = (A[0] + B[0]) / 2, my = (A[1] + B[1]) / 2;
  const sc = EW / (1.5 * w), g = ECX[k];
  g.setTransform(1, 0, 0, 1, 0, 0); g.fillStyle = '#808080'; g.fillRect(0, 0, EW, EH);
  g.setTransform(sc, 0, 0, sc, EW / 2, EH / 2); g.rotate(-ang); g.translate(-mx, -my);
  g.drawImage(v, 0, 0);
  g.setTransform(1, 0, 0, 1, 0, 0);
  // crop coords of the lids (rotate into the eye frame)
  const toC = (p) => { const dx = p[0] - mx, dy = p[1] - my, c = Math.cos(-ang), s = Math.sin(-ang); return [EW / 2 + sc * (dx * c - dy * s), EH / 2 + sc * (dx * s + dy * c)]; };
  const tc = toC(T), dc = toC(D), cy = (tc[1] + dc[1]) / 2, ry = Math.max(2, Math.abs(dc[1] - tc[1]) / 2 * 0.9), rx = sc * w / 2 * 0.85, cxm = (toC(A)[0] + toC(B)[0]) / 2;
  if (ry < 3) return null;                         // closed
  const im = g.getImageData(0, 0, EW, EH).data, vals = [];
  const inside = (x, y) => ((x - cxm) / rx) ** 2 + ((y - cy) / ry) ** 2 <= 1;
  for (let y = 0; y < EH; y++) for (let x = 0; x < EW; x++) if (inside(x, y)) { const i = (y * EW + x) * 4; vals.push(0.299 * im[i] + 0.587 * im[i + 1] + 0.114 * im[i + 2]); }
  if (vals.length < 30) return null;
  const sorted = [...vals].sort((a, b) => a - b), thr = sorted[Math.floor(sorted.length * 0.25)], lo = sorted[0];
  let sx = 0, sy = 0, sw = 0;
  for (let y = 0; y < EH; y++) for (let x = 0; x < EW; x++) if (inside(x, y)) {
    const i = (y * EW + x) * 4, I = 0.299 * im[i] + 0.587 * im[i + 1] + 0.114 * im[i + 2], wt = Math.max(0, thr - I) / Math.max(1, thr - lo);
    sx += wt * x; sy += wt * y; sw += wt;
  }
  if (sw < 1) return null;
  const qx = sx / sw, qy = sy / sw;
  // back to the full frame
  const dx = (qx - EW / 2) / sc, dy = (qy - EH / 2) / sc, c = Math.cos(ang), s = Math.sin(ang);
  return { p: [mx + dx * c - dy * s, my + dx * s + dy * c], c: [qx, qy], ell: [cxm, cy, rx, ry], sc };
}

/* ── features ── */
const EUR = {};                                    // One Euro per head channel
function eyeFeat(P, E, iris) {
  const A = P(E.a), B = P(E.b), T = P(E.t), D = P(E.bo), ix = iris[0], iy = iris[1];
  const ax = B[0] - A[0], ay = B[1] - A[1], w = Math.hypot(ax, ay) || 1, ux = ax / w, uy = ay / w, nx = -uy, ny = ux;
  const mx = (A[0] + B[0]) / 2, my = (A[1] + B[1]) / 2, dx = ix - mx, dy = iy - my;
  return { ex: (dx * ux + dy * uy) / w, ey: (dx * nx + dy * ny) / w, ear: ((D[0] - T[0]) * nx + (D[1] - T[1]) * ny) / w, c: [mx, my] };
}
const EARH = [];
function features(lm, bs, now) {
  const W = CAM.video.videoWidth, H = CAM.video.videoHeight;
  const P = (i) => [lm[i].x * W, lm[i].y * H], P3 = (i) => [lm[i].x * W, lm[i].y * H, lm[i].z * W];
  // iris: the landmark ring, mixed with the eye-crop refinement
  const ref = [], eyes = EYES.map((E, k) => {
    let ix = 0, iy = 0; for (const j of E.iris) { const p = P(j); ix += p[0]; iy += p[1]; } ix /= E.iris.length; iy /= E.iris.length;
    const r = S.opt.refine > 0 || S.view === 'setup' ? refineIris(k, P, E) : null; ref.push(r);
    const m = r ? S.opt.refine : 0;
    return eyeFeat(P, E, [ix + m * (r ? r.p[0] - ix : 0), iy + m * (r ? r.p[1] - iy : 0)]);
  });
  // head frame (EyeTrax): x along the outer eye corners, y towards the forehead, z = x × y
  const L = P3(33), Rr = P3(263), Tp = P3(10), C = [(L[0] + Rr[0]) / 2, (L[1] + Rr[1]) / 2, (L[2] + Rr[2]) / 2];
  const nrm = (v) => { const n = Math.hypot(...v) || 1e-9; return v.map((x) => x / n); };
  const X = nrm([Rr[0] - L[0], Rr[1] - L[1], Rr[2] - L[2]]);
  let Y = [Tp[0] - C[0], Tp[1] - C[1], Tp[2] - C[2]]; const d = Y[0] * X[0] + Y[1] * X[1] + Y[2] * X[2]; Y = nrm([Y[0] - d * X[0], Y[1] - d * X[1], Y[2] - d * X[2]]);
  const Z = nrm([X[1] * Y[2] - X[2] * Y[1], X[2] * Y[0] - X[0] * Y[2], X[0] * Y[1] - X[1] * Y[0]]);
  const ipd = Math.hypot(Rr[0] - L[0], Rr[1] - L[1], Rr[2] - L[2]) || 1;
  const sm = (k, v) => (EUR[k] || (EUR[k] = oneEuro(1.5, 0.3)))(v, now);
  const yaw = sm('yaw', Math.atan2(Z[0], -Z[2])), pitch = sm('pitch', Math.atan2(Z[1], -Z[2])), roll = sm('roll', Math.atan2(X[1], X[0]));
  const hx = sm('hx', C[0] / W), hy = sm('hy', C[1] / H), hs = sm('hs', ipd / W);
  // distance: inter-pupillary ~6.3 cm, horizontal field of view ~60°
  const dist = (W / (2 * Math.tan(Math.PI / 6))) * 6.3 / ipd;

    g.strokeStyle = 'rgba(230,236,242,0.6)'; g.lineWidth = 1.2; g.beginPath();
    F.forEach((f, i) => { const x = box.x + f.u * box.w, y = box.y + f.v * box.h; i ? g.lineTo(x, y) : g.moveTo(x, y); }); g.stroke();
    g.font = '10px monospace'; g.textAlign = 'center'; g.textBaseline = 'middle';
    F.forEach((f, i) => {
      const x = box.x + f.u * box.w, y = box.y + f.v * box.h, r = 5 + Math.sqrt(f.d) * 0.6;
      g.fillStyle = 'rgba(143,200,232,0.35)'; g.strokeStyle = 'rgba(143,200,232,0.95)'; g.beginPath(); g.arc(x, y, r, 0, 7); g.fill(); g.stroke();
      g.fillStyle = '#e6ecf2'; g.fillText(String(i + 1), x, y);
    });
    g.textBaseline = 'alphabetic';
  }
  if (isV) {
    let best = null; for (const s of rec.samples) if (s.ok && s.vt !== null && Math.abs(s.vt - t) < 0.08 && (!best || Math.abs(s.vt - t) < Math.abs(best.vt - t))) best = s;
    if (best) { g.strokeStyle = '#e8c86f'; g.lineWidth = 2; g.beginPath(); g.arc(box.x + best.u * box.w, box.y + best.v * box.h, 12, 0, 7); g.stroke(); }
  }
}
function drawReview() {
  if (!RV || S.view !== 'review') return;
  const c = $('ov'), k = fitCanvas(c, $('view')), g = c.getContext('2d');
  g.setTransform(k, 0, 0, k, 0, 0); g.clearRect(0, 0, c.width, c.height);
  if (RV.missing) { g.strokeStyle = 'rgba(230,236,242,0.15)'; g.strokeRect(RV.box.x, RV.box.y, RV.box.w, RV.box.h); }
  drawOverlay(g, RV.rec, RV.box, RV.rec.type === 'video' ? RV.el.currentTime || 0 : 0);
}
(function rl() { if (S.view === 'review' && RV && RV.el.tagName === 'VIDEO' && !RV.el.paused) drawReview(); requestAnimationFrame(rl); })();
addEventListener('resize', () => { if (S.view === 'review') layoutReview(); });

/* ── export ── */
function download(blob, name) { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 4000); }
const stamp = () => new Date().toISOString().slice(0, 19).replace(/[:T]/g, '-');
function exportCSV() {
  const L = ['file,type,t_ms,video_s,valid,blink,x_px,y_px,raw_x_px,raw_y_px,u,v,head_yaw_deg,head_pitch_deg,head_roll_deg,distance_cm,screen_w,screen_h'];
  for (const r of S.rec) for (const s of r.samples) L.push([JSON.stringify(r.name), r.type, s.t, s.vt ?? '', s.ok ? 1 : 0, s.blink ? 1 : 0, s.x ?? '', s.y ?? '', s.rx ?? '', s.ry ?? '', s.u ?? '', s.v ?? '', s.yaw ?? '', s.pitch ?? '', s.roll ?? '', s.dist ?? '', r.sw, r.sh].join(','));
  download(new Blob([L.join('\n')], { type: 'text/csv' }), `itrack_samples_${stamp()}.csv`);
  const F = ['file,index,t_ms,video_s,duration_ms,x_px,y_px,u,v'];
  for (const r of S.rec) (r.fix || []).forEach((f, i) => F.push([JSON.stringify(r.name), i + 1, f.t, f.vt ?? '', f.d, f.x, f.y, f.u, f.v].join(',')));
  setTimeout(() => download(new Blob([F.join('\n')], { type: 'text/csv' }), `itrack_fixations_${stamp()}.csv`), 300);
}
function exportJSON() {
  const m = S.model;
  const o = { app: 'iTrack', version: 'v002', created: new Date().toISOString(), options: S.opt,
    calibration: m ? { model: m.ft, head_compensation: m.head, targets: m.nTargets, frames: m.n, error_px: m.err ? m.err.px : null, precision_px: m.err ? m.err.prec : null, error_deg: m.err ? m.err.deg : null } : null,
    files: S.rec.map((r) => ({ name: r.name, type: r.type, width: r.nw, height: r.nh, rect: r.rect, screen: [r.sw, r.sh], duration_ms: Math.round(r.dur), drift: r.drift, stats: stats(r), fixations: r.fix, samples: r.samples })) };
  download(new Blob([JSON.stringify(o)], { type: 'application/json' }), `itrack_session_${stamp()}.json`);
}
function exportPNG() {
  if (!RV) return;
  const rec = RV.rec, w = rec.nw, h = rec.nh, c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d');
  g.fillStyle = '#000'; g.fillRect(0, 0, w, h);
  if (!RV.missing) try { g.drawImage(RV.el, 0, 0, w, h); } catch (e) { /* no frame */ }
  const k = w / RV.box.w; g.save(); g.scale(k, k);
  drawOverlay(g, rec, { x: 0, y: 0, w: RV.box.w, h: RV.box.h }, rec.type === 'video' ? RV.el.currentTime || 0 : 0);
  g.restore();
  c.toBlob((b) => download(b, `itrack_${rec.name.replace(/\.[^.]+$/, '')}_${S.opt.heat ? 'heat' : ''}${S.opt.path ? 'path' : ''}.png`), 'image/png');
}
function loadSession(file) {
  const rd = new FileReader();
  rd.onload = () => {
    try {
      const o = JSON.parse(rd.result);
      S.rec = o.files.map((f) => ({ name: f.name, type: f.type, nw: f.width, nh: f.height, rect: f.rect, sw: f.screen[0], sh: f.screen[1], dur: f.duration_ms, drift: f.drift, samples: f.samples, fix: f.fixations }));
      for (const r of S.rec) if (!r.fix) r.fix = fixations(r);
      S.sel = 0; log(`Session loaded: ${S.rec.length} file(s). Add the same files to see them under the gaze.`); hud(); showReview();
    } catch (e) { log(`<span class="bad">Not an iTrack session: ${e.message}</span>`); }
  };
  rd.readAsText(file);
}

/* ── files ── */
function addFiles(list) {
  for (const f of list) {
    const type = f.type.startsWith('video') ? 'video' : f.type.startsWith('image') ? 'image' : null;
    if (!type) continue;
    if (S.files.some((x) => x.name === f.name && x.size === f.size)) continue;
    S.files.push({ name: f.name, type, size: f.size, url: URL.createObjectURL(f) });
  }
  log(`${S.files.length} file(s) in the sequence.`); hud(); buildLeft();
  if (S.view === 'review' && RV && RV.missing) openRec(S.sel);
}
$('fin').addEventListener('change', (e) => { addFiles(e.target.files); e.target.value = ''; });
$('jin').addEventListener('change', (e) => { if (e.target.files[0]) loadSession(e.target.files[0]); e.target.value = ''; });
addEventListener('dragover', (e) => { e.preventDefault(); });
addEventListener('drop', (e) => { e.preventDefault(); if (e.dataTransfer.files.length) addFiles(e.dataTransfer.files); });

/* ── UI helpers ── */
const h = (tag, cls, txt) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt !== undefined) e.innerHTML = txt; return e; };
function grp(L, t) { L.appendChild(h('div', 'grp', t)); }
function note(L, t) { L.appendChild(h('div', 'note', t)); }
function slider(L, label, min, max, step, key, fmt, cb) {
  const r = h('div', 'row sl'), lb = h('label', '', label), inp = document.createElement('input'), v = h('div', 'v');
  Object.assign(inp, { type: 'range', min, max, step, value: S.opt[key] });
  const show = () => (v.textContent = fmt ? fmt(S.opt[key]) : S.opt[key]);
  inp.addEventListener('input', () => { S.opt[key] = +inp.value; show(); saveOpt(); if (cb) cb(); });
  inp.addEventListener('dblclick', () => { S.opt[key] = OPT_DEF[key]; inp.value = OPT_DEF[key]; show(); saveOpt(); if (cb) cb(); });
  show(); r.append(lb, inp, v); L.appendChild(r);
}
function check(L, label, key, cb) {
  const r = h('div', 'chk'), id = 'c_' + key, inp = document.createElement('input');
  Object.assign(inp, { type: 'checkbox', id, checked: !!S.opt[key] });
  inp.addEventListener('change', () => { S.opt[key] = inp.checked; saveOpt(); if (cb) cb(); });
  const lb = h('label', '', label); lb.htmlFor = id; r.append(inp, lb); L.appendChild(r);
}
function select(L, label, opts, key, cb, num) {
  const r = h('div', 'row kv'), s = document.createElement('select');
  s.innerHTML = opts.map(([v, t]) => `<option value="${v}">${t}</option>`).join(''); s.value = String(S.opt[key]);
  s.addEventListener('change', () => { S.opt[key] = num ? +s.value : s.value; saveOpt(); if (cb) cb(); });
  r.append(h('label', '', label), s); L.appendChild(r);
}
function buttons(L, list) { const r = h('div', 'btns'); for (const [t, fn] of list) { const b = h('button', '', t); b.type = 'button'; b.addEventListener('click', fn); r.appendChild(b); } L.appendChild(r); }
function kv(L, k, v) { const r = h('div', 'row kv'); r.append(h('label', '', k), h('div', 'v', v)); L.appendChild(r); }

/* ── left panel ── */
function buildLeft() {
  const L = $('left'), top = L.scrollTop; L.innerHTML = '';
  if (S.view === 'review') return buildReviewPanel(L, top);
  grp(L, 'Files · in playing order');
  const d = h('div', 'drop', 'Add images / videos · or drop them here'); d.addEventListener('click', () => $('fin').click()); L.appendChild(d);
  if (S.files.length) {
    const ls = h('div', 'list');
    S.files.forEach((f, i) => {
      const it = h('div', 'item');
      const up = h('span', 'x', '↑'), dn = h('span', 'x', '↓'), rm = h('span', 'x', '×');
      up.title = 'Earlier'; dn.title = 'Later'; rm.title = 'Remove';
      up.onclick = () => { if (i) { [S.files[i - 1], S.files[i]] = [S.files[i], S.files[i - 1]]; buildLeft(); } };
      dn.onclick = () => { if (i < S.files.length - 1) { [S.files[i + 1], S.files[i]] = [S.files[i], S.files[i + 1]]; buildLeft(); } };
      rm.onclick = () => { URL.revokeObjectURL(f.url); S.files.splice(i, 1); hud(); buildLeft(); };
      it.append(h('span', 'ty', String(i + 1).padStart(2, '0')), h('span', 'nm', f.name), h('span', 'ty', f.type), up, dn, rm);
      ls.appendChild(it);
    });
    L.appendChild(ls);
    buttons(L, [['Clear all', () => { for (const f of S.files) URL.revokeObjectURL(f.url); S.files = []; hud(); buildLeft(); }]]);
  }
  grp(L, 'Playback');
  slider(L, 'Image duration (s)', 1, 30, 0.5, 'imgDur');
  slider(L, 'Gap between files (s)', 0, 3, 0.1, 'gap');
  check(L, 'Mute videos', 'mute');
  check(L, 'Drift check before each file', 'drift');
  check(L, 'Show my gaze while playing', 'showGaze');
  note(L, 'Videos play to their end. During the run: Space at the cross (drift check), → or N skips a file, Esc stops (what was recorded is kept).');
  grp(L, 'Tracking');
  check(L, 'Head crop · track and enlarge the head', 'crop', () => { ROI.ok = false; });
  select(L, 'Head crop size', [[384, '384 px'], [512, '512 px'], [768, '768 px']], 'cropRes', null, true);
  slider(L, 'Iris refine (eye crops)', 0, 1, 0.05, 'refine', (v) => v.toFixed(2));
  note(L, 'The head is followed as a region of the full camera frame, cut out and enlarged before the landmarks are found. Each eye is cut from the full frame too and enlarged; the iris centre is refined there (darkest pixels inside the eye opening, yellow ring) and mixed with the landmark iris. Both are shown on the right.');
  grp(L, 'Calibration');
  select(L, 'Targets', [['4', '4 corners'], ['9', '9 · corners, edges, centre']], 'calib');
  slider(L, 'Rounds', 1, 3, 1, 'rounds');
  slider(L, 'Corner inset (px)', 10, 150, 1, 'inset');
  check(L, 'Automatic capture (no clicking)', 'autoCal');
  check(L, 'Head sweep · learn head compensation', 'sweep');
  slider(L, 'Head sweep (s)', 5, 20, 1, 'sweepDur');
  check(L, 'Smooth pursuit · follow a moving dot', 'pursuit');
  slider(L, 'Pursuit (s)', 4, 20, 1, 'pursuitDur');
  select(L, 'Model', [['rich', 'Eye region + head pose (EyeTrax-style)'], ['simple', 'Iris offset + head pose']], 'ft');
  slider(L, 'Ridge λ (eye region, log10)', -2, 2, 0.1, 'lam10', (v) => Math.pow(10, v).toPrecision(2));
  note(L, 'Clicks: look at each dot and click it while looking (or let the ring close, automatic). Head sweep: look at the centre dot while turning the head left, right, up, down and tilting it - the target stays, the head moves, so the fit learns how head rotation shifts the eye signal and cancels it. Pursuit: follow a dot along a curve, many targets in seconds; the eye-region model needs it (or 9 targets).');
  grp(L, 'Smoothing');
  select(L, 'Filter', [['euro', 'One Euro'], ['kalman', 'Kalman (tuned by validation)'], ['none', 'None']], 'filter');
  if (S.opt.filter === 'euro') slider(L, 'Smoothing', 0, 1, 0.01, 'smooth', (v) => v.toFixed(2));
  if (S.opt.filter === 'kalman') slider(L, 'Kalman agility (log10)', -1, 4, 0.1, 'kq', (v) => v.toFixed(1));
  if (S.model) {
    grp(L, 'Calibration result');
    kv(L, 'Model', `${S.model.ft === 'rich' ? 'eye region' : 'iris offset'}${S.model.head ? ' + head' : ''}`);
    kv(L, 'Targets / frames', `${S.model.targets} / ${S.model.n}`);
    if (S.model.err) { kv(L, 'Accuracy', `${S.model.err.px.toFixed(0)} px · ${S.model.err.deg.toFixed(1)}°`); kv(L, 'Precision', `${S.model.err.prec.toFixed(0)} px`); }
    kv(L, 'Head distance', `${S.model.head0.dist.toFixed(0)} cm`);
  }
  const sm = savedModel();
  if (sm && !S.model) {
    grp(L, 'Saved calibration');
    note(L, `From ${sm.saved ? sm.saved.slice(0, 16).replace('T', ' ') : 'earlier'}${sm.err ? `, ${sm.err.px.toFixed(0)} px` : ''}. Valid only for the same camera, screen and sitting position.`);
    buttons(L, [['Use it', () => { S.model = sm; S.model.off = [0, 0]; log('Saved calibration loaded. Check it in Test gaze.'); hud(); buildLeft(); }]]);
  }
  grp(L, 'Earlier sessions');
  buttons(L, [['Load session JSON', () => $('jin').click()]]);
  if (S.rec.length) buttons(L, [['Review last run', showReview]]);
  note(L, 'Everything runs in this browser: the camera image and your files are not uploaded. MediaPipe and its face model are loaded from the CDN once.');
  L.scrollTop = top;

}
function buildReviewPanel(L, top) {
  grp(L, 'Recorded files');
  const ls = h('div', 'list');
  S.rec.forEach((r, i) => {
    const st = stats(r), it = h('div', 'item' + (i === S.sel ? ' sel' : ''));
    it.append(h('span', 'ty', String(i + 1).padStart(2, '0')), h('span', 'nm', r.name), h('span', 'ty', `${(st.valid * 100).toFixed(0)}%`));
    it.onclick = () => openRec(i);
    ls.appendChild(it);
  });
  L.appendChild(ls);
  const r = S.rec[S.sel];
  if (r) {
    const st = stats(r);
    grp(L, 'This file');
    kv(L, 'Duration', `${(r.dur / 1000).toFixed(1)} s · ${st.hz.toFixed(0)} Hz`);
    kv(L, 'Valid samples', `${(st.valid * 100).toFixed(0)} % of ${st.n}`);
    kv(L, 'Gaze on the media', `${(st.onMedia * 100).toFixed(0)} %`);
    kv(L, 'Fixations', `${st.fix} · mean ${st.meanFix.toFixed(0)} ms`);
    const hd = r.samples.filter((s) => s.yaw !== undefined);
    if (hd.length) kv(L, 'Head range (yaw / pitch)', `${(Math.max(...hd.map((s) => s.yaw)) - Math.min(...hd.map((s) => s.yaw))).toFixed(0)}° / ${(Math.max(...hd.map((s) => s.pitch)) - Math.min(...hd.map((s) => s.pitch))).toFixed(0)}°`);
  }
  grp(L, 'Display');
  check(L, 'Heatmap', 'heat', drawReview);
  check(L, 'Scanpath (fixations)', 'path', drawReview);
  check(L, 'Raw samples', 'raw', drawReview);
  slider(L, 'Heat radius (px)', 8, 150, 1, 'radius', null, drawReview);
  slider(L, 'Heat opacity', 0.1, 1, 0.01, 'alpha', (v) => v.toFixed(2), drawReview);
  slider(L, 'Video window (s)', 0.2, 10, 0.1, 'win', (v) => v.toFixed(1), drawReview);
  grp(L, 'Fixations');
  const refix = () => { for (const q of S.rec) q.fix = fixations(q); buildLeft(); drawReview(); };
  slider(L, 'Dispersion (px)', 20, 200, 1, 'disp', null, refix);
  slider(L, 'Min duration (ms)', 50, 400, 10, 'minFix', null, refix);
  note(L, 'A fixation: consecutive samples that stay inside the dispersion (x range + y range, in screen px) for at least the minimum duration. On videos, heatmap and scanpath show the window before the playhead.');
  grp(L, 'Export');
  buttons(L, [['CSV', exportCSV], ['JSON', exportJSON], ['PNG', exportPNG]]);
  note(L, 'CSV: every sample (screen px, raw and smoothed, u / v inside the media, head yaw / pitch / roll and distance) plus a fixation table. JSON: the whole session, loadable here later. PNG: the current view at the media resolution.');
  buttons(L, [['Back to setup', () => { if (RV && RV.el) { if (RV.el.pause) RV.el.pause(); RV.el.remove(); } RV = null; S.view = 'setup'; $('ov').getContext('2d').clearRect(0, 0, $('ov').width, $('ov').height); buildLeft(); }]]);
  L.scrollTop = top;
}

$('bcal').addEventListener('click', calibrate);
$('btest').addEventListener('click', testGaze);
$('brun').addEventListener('click', run);
$('brev').addEventListener('click', showReview);
addEventListener('resize', () => { if (S.view === 'setup') drawCam(); });

buildLeft(); hud(); drawCam();
log('Add your files, then <b>1 · Camera</b>, <b>2 · Calibrate</b>, <b>3 · Run</b>.');
</script>
